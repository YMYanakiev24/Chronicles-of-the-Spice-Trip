<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The page around the browser build. Emscripten puts the game where SCRIPT is (web/CMakeLists.txt). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chronicles of the Spice Trip</title>
<meta name="description" content="A dark pixel-art dungeon crawler. Pick a champion and fight down through the Mistwood Depths.">
<meta name="theme-color" content="#08080e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spice Trip">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root { --cw: 100vw; --ch: 100vh; --ink: #08080e; --panel: #161222; --gold: #f0cd78; --text: #e8e4f0; --muted: #a09ab4; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text);
    font: 16px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  }
  body { position: fixed; inset: 0; }
  /* The canvas is drawn at the size the game asks for and shown as large as the window allows. */
  #canvas {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: var(--cw); height: var(--ch); display: block; outline: none; touch-action: none; background: #000;
  }
  body:not(.playing) #canvas { visibility: hidden; }

  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 20px; box-sizing: border-box; text-align: center;
  }
  #start { background: linear-gradient(rgba(8, 8, 14, .35), rgba(8, 8, 14, .85)), url(poster.jpg) center / cover no-repeat var(--ink); }
  body.playing #start { display: none; }
  h1 {
    margin: 0; color: var(--gold); font-size: clamp(22px, 5.4vw, 52px); letter-spacing: .04em; line-height: 1.1;
    text-shadow: 0 3px 0 #000, 0 0 24px rgba(0, 0, 0, .8); text-transform: uppercase;
  }
  .sub { margin: 0; color: var(--muted); font-size: clamp(12px, 2vw, 16px); text-shadow: 0 2px 0 #000; }
  #loading { width: min(420px, 80vw); display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .track { width: 100%; height: 12px; background: rgba(22, 18, 34, .9); border: 2px solid #000; box-shadow: 0 0 0 2px var(--gold); }
  #bar { width: 0; height: 100%; background: var(--gold); transition: width .2s; }
  #status { font-size: 13px; color: var(--text); text-shadow: 0 2px 0 #000; min-height: 1.4em; }
  #play {
    font: inherit; font-size: clamp(18px, 3.4vw, 26px); color: #1a1408; background: var(--gold);
    border: 3px solid #000; box-shadow: 0 0 0 3px var(--gold), 0 6px 0 3px #000; padding: 12px 34px; cursor: pointer;
    text-transform: uppercase; letter-spacing: .06em;
  }
  #play:active { transform: translateY(3px); box-shadow: 0 0 0 3px var(--gold), 0 3px 0 3px #000; }
  .tips { display: flex; flex-direction: column; gap: 4px; max-width: 560px; font-size: 12px; color: var(--muted); text-shadow: 0 2px 0 #000; }
  .tips a { color: var(--gold); }
  [hidden] { display: none !important; }

  /* Phones: the game wants the phone sideways. */
  #rotate { display: none; background: rgba(8, 8, 14, .96); z-index: 5; }
  @media (orientation: portrait) { body.touch.playing #rotate { display: flex; } }
  .phone { width: 46px; height: 80px; border: 4px solid var(--gold); border-radius: 9px; animation: turn 2.2s ease-in-out infinite; }
  @keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }

  #error { background: rgba(8, 8, 14, .97); z-index: 6; }
  #error p { max-width: 560px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

<div id="start" class="screen">
  <h1>Chronicles of the<br>Spice Trip</h1>
  <p class="sub">A dark pixel-art dungeon crawler</p>
  <div id="loading">
    <div class="track"><div id="bar"></div></div>
    <div id="status">Loading…</div>
  </div>
  <button id="play" hidden>Play</button>
  <div class="tips">
    <span id="tip-controls"></span>
    <span id="tip-ios" hidden>On iPhone: tap <b>Share</b> → <b>Add to Home Screen</b>, then open it from there to play fullscreen.</span>
    <span id="tip-android" hidden>Rather have the app? <a href="https://github.com/YMYanakiev24/Chronicles-of-the-Spice-Trip/releases/latest">Get the Android APK</a>.</span>
  </div>
</div>

<div id="rotate" class="screen"><div class="phone"></div><p>Turn your phone sideways</p></div>
<div id="error" class="screen" hidden><h1>Oh no</h1><p id="error-text"></p><button id="reload" onclick="location.reload()" style="font:inherit">Reload</button></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var root = document.documentElement, body = document.body;
  var ua = navigator.userAgent;
  var query = new URLSearchParams(location.search).get('touch');
  // Same test as PlatformWeb.cpp: a phone or tablet gets the touch controls.
  var touchUI = query === '1' ? true : query === '0' ? false :
    matchMedia('(pointer: coarse)').matches || matchMedia('(hover: none)').matches;
  var iOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = navigator.standalone === true || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
  if (touchUI) body.classList.add('touch');

  $('#tip-controls').textContent = touchUI
    ? 'Turn your phone sideways. Left thumb moves; Blade, Cast, Roll and E are on the right.'
    : 'WASD to move, mouse to aim, click to swing. F11 for fullscreen.';
  if (iOS && !standalone) $('#tip-ios').hidden = false;
  if (/Android/.test(ua) && !standalone) $('#tip-android').hidden = false;

  // The game draws 720 lines tall on phones (like the Android app) and at the window's own
  // size on computers, always as wide as the window's shape. PlatformWeb.cpp reads spiceW/H.
  function fit() {
    var vw = window.innerWidth || 1280, vh = window.innerHeight || 720;
    var aspect = Math.max(vw / vh, 4 / 3);
    var h = touchUI ? 720 : Math.min(1440, Math.max(720, Math.round(vh)));
    Module.spiceW = Math.round(h * aspect);
    Module.spiceH = h;
    var cssW = Math.min(vw, vh * aspect);
    root.style.setProperty('--cw', cssW + 'px');
    root.style.setProperty('--ch', cssW / aspect + 'px');
  }
  ['resize', 'orientationchange', 'fullscreenchange', 'webkitfullscreenchange'].forEach(function (e) {
    window.addEventListener(e, fit);
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);

  // No page scrolling, pinching or double-tap zoom: every touch is for the game.
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  function showError(text) {
    $('#error-text').textContent = text;
    $('#error').hidden = false;
  }
  window.addEventListener('error', function (e) {
    if (!body.classList.contains('playing') || /abort|Aborted|RuntimeError/.test(String(e.message)))
      showError('The game stopped: ' + (e.message || 'unknown error') + '. Reloading usually helps.');
  });

  function mb(bytes) { return (bytes / 1048576).toFixed(0); }
  var bar = $('#bar'), status = $('#status'), play = $('#play');

  // A new version is fetched as a whole: the published page names its build here
  // (.github/workflows/web.yml), so a phone never mixes an old index.js with a new index.data.
  var build = 'bd72064a';
  window.Module = {
    canvas: $('#canvas'),
    locateFile: function (path, prefix) { return prefix + path + (build === 'dev' ? '' : '?v=' + build); },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (text) {
      var m = /\(([\d.]+)\/([\d.]+)\)/.exec(text || '');
      if (m && +m[2] > 0) {
        bar.style.width = Math.min(100, 100 * m[1] / m[2]).toFixed(1) + '%';
        status.textContent = 'Loading ' + mb(+m[1]) + ' / ' + mb(+m[2]) + ' MB';
      }
      else if (text && !/Running/.test(text)) status.textContent = 'Getting ready…';
    },
    spiceReady: function () {          // web/pre.js: loaded, waiting for the tap
      bar.style.width = '100%';
      $('#loading').hidden = true;
      play.hidden = false;
      play.textContent = touchUI ? 'Tap to play' : 'Play';
      play.focus();
    },
    onAbort: function (what) { showError('The game stopped (' + what + '). Reloading usually helps.'); }
  };
  fit();

  // The game starts inside the tap, so the browser lets it play sound.
  var started = false;
  function start() {
    if (started) return;
    started = true;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}  // iPhone: sound with the silent switch on
    if (touchUI && !iOS) {                       // Android: fullscreen and sideways
      var go = root.requestFullscreen || root.webkitRequestFullscreen;
      if (go) {
        try {
          Promise.resolve(go.call(root, { navigationUI: 'hide' })).then(function () {
            if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
          }).catch(function () {});
        } catch (e) {}
      }
    }
    body.classList.add('playing');
    fit();
    $('#canvas').focus();
    delete Module.setStatus;                     // without it, main runs right here, inside the tap
    Module.spiceStart();
  }
  play.addEventListener('click', start);

  // Quiet while the tab is hidden; wake the sound again if the phone paused it.
  function eachAudio(fn) {
    var ma = window.miniaudio;
    if (!ma || !ma.devices) return;
    ma.devices.forEach(function (d) { if (d && d.webaudio) fn(d.webaudio); });
  }
  document.addEventListener('visibilitychange', function () {
    eachAudio(function (ctx) { (document.hidden ? ctx.suspend() : ctx.resume()).catch(function () {}); });
  });
  ['touchend', 'click', 'keydown'].forEach(function (e) {
    document.addEventListener(e, function () {
      if (!document.hidden) eachAudio(function (ctx) { if (ctx.state !== 'running') ctx.resume().catch(function () {}); });
    }, true);
  });
})();
</script>
<script async type="text/javascript" src="index.js?v=bd72064a"></script>
</body>
</html>
