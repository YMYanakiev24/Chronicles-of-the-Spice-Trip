# Builds the Android APK. Pushing a tag like v0.1.0 also publishes it as a GitHub release,
# and so does running it by hand (Actions > Android > Run workflow) with a version filled in.
name: Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish as a release with this version (like v0.4.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      PROJECT: Chronicles-of-the-Spice-Trip/android
      # the release's tag: the one pushed, or the version asked for by hand (empty: no release)
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - name: Check the version
        if: env.RELEASE_TAG != ''
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version should look like v0.4.0 (got '$RELEASE_TAG')"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Add a keystore as the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets
      # so that new versions install over old ones. Without them a throwaway key is used.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          file="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$file"
            password="$KEYSTORE_PW"
          else
            echo "::notice::Signed with a throwaway key: uninstall the old version before installing this one"
            password="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$file" -storepass "$password" -keypass "$password" \
              -alias spicetrip -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Spice Trip"
          fi
          echo "::add-mask::$password"
          echo "KEYSTORE_FILE=$file" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=spicetrip" >> "$GITHUB_ENV"

      - name: Build
        run: |
          export VERSION_CODE="$GITHUB_RUN_NUMBER"
          if [ -n "$RELEASE_TAG" ]; then export VERSION_NAME="${RELEASE_TAG#v}"; fi
          set -o pipefail
          gradle -p "$PROJECT" assembleRelease --console=plain --no-daemon 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: grep -E "error:|What went wrong|FAILED|Could not" -A2 build.log | head -40 | sed 's/^/::error::/'

      - name: Collect APK
        run: cp "$PROJECT"/app/build/outputs/apk/release/app-release.apk ChroniclesOfTheSpiceTrip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfTheSpiceTrip-apk
          path: ChroniclesOfTheSpiceTrip.apk

      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: ChroniclesOfTheSpiceTrip.apk
          generate_release_notes: true
          body: |
            Android build of Chronicles of the Spice Trip. Download the APK on your phone, open it,
            and allow installing from this source when Android asks.

            Move with the left side of the screen. Blade, Cast, Roll and E are on the right, and
            tap a spell on the bar to select it.

            Co-op: on the same Wi-Fi, play one run together with other phones or Windows PCs
            (up to four players). Open Co-op from the main menu: one player hosts, the others join.
